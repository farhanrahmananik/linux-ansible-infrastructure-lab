---
- name: Manage packages on managed nodes
  hosts: managed_nodes
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name: "{{ managed_packages }}"
        state: present
